<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monopoly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lobby-pantalla">
    <div class="lobby-caja">
        <h1>MONOPOLY LOBBY</h1>
        
        <div id="registro-jugador">
            <input type="text" id="inputNombre" placeholder="Tu Nombre" maxlength="15">
            <select id="selectFicha">
                <option value="0">🚗 Coche</option>
                <option value="1">🎩 Sombrero</option>
                <option value="2">🐶 Perro</option>
                <option value="3">🚢 Barco</option>
            </select>
            <button id="btnUnirse">Unirse a la partida</button>
        </div>

        <div id="lista-espera" style="display:none;">
            <h3>Jugadores en sala:</h3>
            <ul id="ulJugadoresLobby"></ul>
            <button id="btnListo">¡Estoy Listo!</button>
        </div>
    </div>
</div>

<div id="contenedor">

    <div id="panel-jugadores">
        <h2>Jugadores</h2>
        <div id="lista-jugadores"></div>
    </div>

    <div id="tablero"></div>

    <div id="panel">

        <h2>MONOPOLY</h2>

        <div id="turno">
            <strong>TURNO ACTUAL</strong><br>
            -
        </div>
        <div id="dados">
            <strong>🎲 DADOS</strong><br>
        -
        </div>

        <div id="dinero">
            Dinero: -
        </div>

        <div id="eventos">
            Bienvenido al juego
        </div>

        <div id="compra-panel" style="display:none;">
            <p id="mensaje-compra"></p>
            <button id="btnComprar">Comprar</button>
            <button id="btnNoComprar">No Comprar / Subastar</button>
        </div>

        <div id="subasta-panel" style="display:none;">
            <h3>Subasta</h3>

            <p id="info-subasta">
                Subasta no iniciada
            </p>

            <input
                type="number"
                id="inputPuja"
                placeholder="Monto de puja">

            <button id="btnPujar">Pujar</button>
            <button id="btnRetirarse">Retirarse</button>
        </div>

        <button id="btnDado">Tirar Dados</button>

        <button id="btnTerminarTurno" style="display:none; background-color: #ffcccc;">Terminar Turno</button>

            <h3>Construcción</h3>

            <select id="selectPropiedadConstruir">
                <option value="">Selecciona propiedad</option>
            </select>

            <button id="btnConstruirCasa">Construir Casa</button>
            <button id="btnConstruirHotel">Construir Hotel</button>
            <button id="btnHipotecar">Hipotecar</button>
            <button id="btnLevantarHipoteca">Levantar Hipoteca</button>
        </div>


    </div>

</div>

<script src="game.js"></script>

</body>
</html>
